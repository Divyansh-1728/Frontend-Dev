<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Boolean Logic Access System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h2>Boolean Logic Access System</h2>

        <div class="form-group">
            <label><input type="checkbox" id="isDoorLocked" checked /> Door Locked</label>
        </div>
        <div class="form-group">
            <label><input type="checkbox" id="isWindowClosed" checked /> Window Closed</label>
        </div>
        <div class="form-group">
            <label><input type="checkbox" id="isAlarmOn" checked /> Alarm On</label>
        </div>
        <div class="form-group">
            <label><input type="checkbox" id="isOwnerInside" /> Owner Inside</label>
        </div>

        <button onclick="checkSecurity()">Check Security Status</button>

        <div class="result" id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
