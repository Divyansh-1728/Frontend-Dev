<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Library Fine Calculator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
    <h2>Library Fine Calculator</h2>
    <form id="fineForm">
        <label>Enter delay days for each late book (comma separated):</label>
        <input type="text" id="delays" placeholder="e.g. 3,7,10,12" />
        <button type="button" onclick="calculateFine()">Calculate Fine</button>
    </form>
    <div class="result" id="result"></div>
</div>
<script src="script.js"></script>
</body>
</html>
