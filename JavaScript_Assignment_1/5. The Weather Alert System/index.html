<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Weather Alert System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h2>Weather Alert System</h2>
        <div class="form-group">
            <label for="temperature">Temperature (°C):</label>
            <input type="number" id="temperature" step="0.1" />
        </div>
        <div class="form-group">
            <label for="humidity">Humidity (%):</label>
            <input type="number" id="humidity" step="1" min="0" max="100" />
        </div>
        <div class="form-group">
            <label for="windSpeed">Wind Speed (km/h):</label>
            <input type="number" id="windSpeed" step="0.1" />
        </div>
        <button onclick="checkWeather()">Check Weather</button>
        <div class="result" id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
