<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Commerce Delivery Estimator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Delivery Estimator</h2>
        <div class="form-group">
            <label for="orderAmount">Order Amount (₹):</label>
            <input type="number" id="orderAmount" min="0" value="0">
        </div>
        <div class="form-group">
            <label><input type="checkbox" id="isPremium"> Premium Member</label>
        </div>
        <div class="form-group">
            <label><input type="checkbox" id="isRemote"> Remote Address</label>
        </div>
        <button onclick="estimateDelivery()">Estimate</button>
        <div class="result" id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
