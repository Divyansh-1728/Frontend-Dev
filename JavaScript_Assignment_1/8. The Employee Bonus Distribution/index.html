<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Employee Bonus Distribution</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h2>Employee Bonus Distribution</h2>
        <div class="form-group">
            <label for="baseSalary">Base Salary (₹):</label>
            <input type="number" id="baseSalary" min="0" step="0.01" />
        </div>
        <div class="form-group">
            <label for="performanceRating">Performance Rating (1-5):</label>
            <input type="number" id="performanceRating" min="1" max="5" />
        </div>
        <div class="form-group">
            <label for="experienceYears">Years of Experience:</label>
            <input type="number" id="experienceYears" min="0" />
        </div>
        <button onclick="calculateBonus()">Calculate Bonus</button>
        <div class="result" id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
