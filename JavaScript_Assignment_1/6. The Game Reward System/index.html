<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Game Reward System</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h2>Game Reward System</h2>
        <div class="form-group">
            <label for="level">Player Level:</label>
            <input type="number" id="level" min="1" value="1" />
        </div>
        <div class="form-group">
            <label for="performanceScore">Performance Score:</label>
            <input type="number" id="performanceScore" min="0" value="0" />
        </div>
        <div class="form-group">
            <label><input type="checkbox" id="missionsCompleted" /> Completed All Missions</label>
        </div>
        <button onclick="calculateRewards()">Calculate Rewards</button>
        <div class="result" id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
