<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Restaurant Billing with Tips</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h2>Restaurant Billing System</h2>
        <div class="form-group">
            <label for="baseCost">Base Food Cost (₹):</label>
            <input type="number" id="baseCost" min="0" step="0.01" />
        </div>
        <div class="form-group">
            <label><input type="checkbox" id="diningIn" /> Dining In (Service Tax applicable)</label>
        </div>
        <button onclick="calculateBill()">Calculate Bill</button>
        <div class="result" id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
