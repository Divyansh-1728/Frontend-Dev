<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cinema Ticketing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Cinema Ticketing</h2>
        <div class="form-group">
            <label for="showType">Show:</label>
            <select id="showType">
                <option value="morning">Morning (₹120)</option>
                <option value="evening">Evening (₹180)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="userType">User Type:</label>
            <select id="userType">
                <option value="regular">Regular</option>
                <option value="student">Student</option>
                <option value="senior">Senior (age &gt; 60)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" min="1" value="25">
        </div>
        <div class="form-group">
            <label for="tickets">Number of Tickets:</label>
            <input type="number" id="tickets" min="1" value="1">
        </div>
        <button onclick="calculateTicket()">Calculate</button>
        <div class="result" id="result"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
