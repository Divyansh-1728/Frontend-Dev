<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6. CSS Transformations Showcase</title>
    <link rel="stylesheet" href="06_transformations.css">
</head>
<body>

    <h1>CSS 2D Transformations</h1>

    <!-- Flexbox Container for horizontal alignment -->
    <div class="container">
        
        <div class="demo-wrapper">
            <div class="box box-rotate">Rotate (45deg)</div>
            <p><code>transform: rotate()</code></p>
        </div>

        <div class="demo-wrapper">
            <div class="box box-scale">Scale (1.2x)</div>
            <p><code>transform: scale()</code></p>
        </div>

        <div class="demo-wrapper">
            <div class="box box-translate">Translate (30px)</div>
            <p><code>transform: translate()</code></p>
        </div>

        <div class="demo-wrapper">
            <div class="box box-skew">Skew (15deg)</div>
            <p><code>transform: skew()</code></p>
        </div>

    </div>

</body>
</html>
