<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Borders and Padding Demonstration</title>
    <link rel="stylesheet" href="01_borders_padding.css">
</head>
<body>

    <h1>CSS Borders & Padding Showcase</h1>

    <!-- Flexbox Container to align boxes horizontally -->
    <div class="container">
        
        <!-- Box 1: Solid Border & Uniform Padding -->
        <div class="box box-solid">
            <h2>Solid Border</h2>
            <p>Uniform padding of 30px applied here.</p>
        </div>

        <!-- Box 2: Dashed Border & Different Border Radii -->
        <div class="box box-dashed">
            <h2>Dashed Border</h2>
            <p>Border radius: 20px 0 20px 0.</p>
        </div>

        <!-- Box 3: Double Border & Asymmetrical Padding -->
        <div class="box box-double">
            <h2>Double Border</h2>
            <p>Asymmetrical padding (10px top/bottom, 40px left/right).</p>
        </div>

        <!-- Box 4: Groove Border & Large Radius -->
        <div class="box box-groove">
            <h2>Groove Border</h2>
            <p>Fully rounded corners (50% border radius).</p>
        </div>

    </div>

</body>
</html>
