<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4. Shadows and Depth Effect Layout</title>
    <link rel="stylesheet" href="04_shadows.css">
</head>
<body>

    <!-- Text shadow to heading -->
    <h1>Profile Cards with Depth</h1>

    <!-- Flexbox Container for alignment -->
    <div class="card-container">
        
        <!-- Card 1: Subtle Shadow -->
        <div class="card card-subtle">
            <h2>Card 1: Subtle</h2>
            <img src="https://placehold.co/100x100/10b981/ffffff?text=U1" alt="User 1">
            <p>A gentle lift and shadow, best for lists and navigation.</p>
        </div>

        <!-- Card 2: Medium Shadow -->
        <div class="card card-medium">
            <h2>Card 2: Medium</h2>
            <img src="https://placehold.co/100x100/f59e0b/ffffff?text=U2" alt="User 2">
            <p>A more prominent elevation, suitable for main content blocks.</p>
        </div>

        <!-- Card 3: Deep Shadow -->
        <div class="card card-deep">
            <h2>Card 3: Deep</h2>
            <img src="https://placehold.co/100x100/ef4444/ffffff?text=U3" alt="User 3">
            <p>A pronounced 3D effect, ideal for modals or calls-to-action.</p>
        </div>

    </div>

</body>
</html>
