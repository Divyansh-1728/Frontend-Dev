<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio Basics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="Personal_Portfolio_Basics.css">
</head>
<body>

    <div class="container p-5"> 
        <main class="text-center"> 

            <header class="mb-5"> 
                <h1 class="display-4 fw-bold">Alex Carter</h1> <p class="lead text-muted">Web Developer | UI/UX Enthusiast</p>
            </header>

            <section class="mb-5">
                <img 
                    src="https://via.placeholder.com/150/007bff/ffffff?text=AC" 
                    alt="Profile Picture" 
                    class="img-fluid rounded-circle mb-3 border border-primary border-4" 
                    style="width: 150px; height: 150px; object-fit: cover;"> 
                
                <p class="mt-4">
                    Hello! I specialize in creating robust and responsive web applications.
                </p>
            </section>

            <section class="mb-5">
                <a href="#contact" class="btn btn-primary btn-lg me-3 shadow-sm">Hire Me</a> 
                <a href="#" class="btn btn-outline-secondary btn-lg">Download CV</a> 
            </section>

            <section id="contact" class="bg-light p-4 rounded shadow mx-auto" style="max-width: 500px;"> 
                <h3 class="mb-3">Get in Touch</h3> <form>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Your Name" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" class="form-control" placeholder="Your Email" required>
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" rows="3" placeholder="Your Message"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Send Message</button>
                </form>
            </section>

        </main>
    </div>

</body>
</html>
