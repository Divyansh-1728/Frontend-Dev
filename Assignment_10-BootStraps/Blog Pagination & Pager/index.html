<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Pagination & Pager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

    <main class="container py-5" style="max-width: 800px;">
        <h1 class="text-center mb-5">Blog Archive (Page 2 of 5)</h1>

        <section class="mb-5 p-4 border rounded bg-white shadow-sm">
            <p>Content for posts on this page goes here...</p>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Laudantium, illo?</p>
        </section>

        <nav aria-label="Blog Pagination" class="mb-5">
            <ul class="pagination justify-content-center">
                
                <li class="page-item disabled">
                    <a class="page-link" href="#" tabindex="-1" aria-disabled="true">Previous</a>
                </li>
                
                <li class="page-item"><a class="page-link" href="#">1</a></li>
                <li class="page-item active" aria-current="page">
                    <a class="page-link" href="#">2</a>
                </li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                
                <li class="page-item">
                    <a class="page-link" href="#">Next</a>
                </li>
                
            </ul>
        </nav>

        <hr>

        <nav aria-label="Older/Newer Posts" class="d-flex justify-content-between">
            <a href="#" class="btn btn-outline-secondary">
                &larr; Newer Posts
            </a>
            <a href="#" class="btn btn-outline-secondary">
                Older Posts &rarr;
            </a>
        </nav>

    </main>

</body>
</html>
