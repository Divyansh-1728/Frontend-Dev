<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog Grid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="Product_Catalog.css">
</head>
<body>

    <main class="container py-5">
        <h1 class="text-center mb-5 text-dark">Featured Products</h1>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4"> 
            <div class="col">
                <div class="card h-100 product-card shadow-sm">
                    <img src="https://via.placeholder.com/400x300/f39c12/ffffff?text=Product+A" class="card-img-top" alt="Product A">
                    <div class="card-body text-center">
                        <h5 class="card-title">Vintage Leather Bag</h5>
                        <p class="card-text text-success fw-bold">$49.99</p>
                        <a href="#" class="btn btn-primary w-100">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 product-card shadow-sm">
                    <img src="https://via.placeholder.com/400x300/3498db/ffffff?text=Product+B" class="card-img-top" alt="Product B">
                    <div class="card-body text-center">
                        <h5 class="card-title">Classic T-Shirt</h5>
                        <p class="card-text text-success fw-bold">$19.50</p>
                        <a href="#" class="btn btn-primary w-100">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 product-card shadow-sm">
                    <img src="https://via.placeholder.com/400x300/2ecc71/ffffff?text=Product+C" class="card-img-top" alt="Product C">
                    <div class="card-body text-center">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="card-text text-success fw-bold">$99.00</p>
                        <a href="#" class="btn btn-primary w-100">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col">
                <div class="card h-100 product-card shadow-sm">
                    <img src="https://via.placeholder.com/400x300/9b59b6/ffffff?text=Product+D" class="card-img-top" alt="Product D">
                    <div class="card-body text-center">
                        <h5 class="card-title">Minimalist Watch</h5>
                        <p class="card-text text-success fw-bold">$75.99</p>
                        <a href="#" class="btn btn-primary w-100">Add to Cart</a>
                    </div>
                </div>
            </div>
            
        </div>
    </main>

</body>
</html>
