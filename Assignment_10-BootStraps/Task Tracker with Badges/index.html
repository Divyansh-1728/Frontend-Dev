<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker with Badges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

    <main class="container py-5">
        <div class="card shadow-lg mx-auto" style="max-width: 600px;">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">Pending Tasks</h3>
                <span class="badge bg-danger rounded-pill fs-6">
                    4 Pending
                </span>
            </div>
            
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Finalize Q3 Budget Report
                        <span class="badge bg-danger rounded-pill">High</span>
                    </li>
                    
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Update website footer contact info
                        <span class="badge bg-warning text-dark rounded-pill">Medium</span>
                    </li>
                    
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Schedule team meeting for Friday
                        <span class="badge bg-info rounded-pill">Low</span>
                    </li>
                    
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Review marketing proposal
                        <span class="badge bg-danger rounded-pill">High</span>
                    </li>
                    
                </ul>
                
                <hr>

                <button type="button" class="btn btn-success mt-3 w-100">
                    Mark as Completed 
                    <span class="badge bg-light text-success ms-2">
                        +1
                    </span>
                </button>
            </div>
        </div>
    </main>

</body>
</html>
