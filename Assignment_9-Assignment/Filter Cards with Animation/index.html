<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards with Animation</title>
    <link rel="stylesheet" href="Filter_Cards_with_Animation.css">
</head>
<body>
    <main class="container">
        <h1>Profile Cards with Filters and Animation</h1>
        
        <section class="profile-cards">
            
            <div class="card card-1 grayscale-filter">
                <img src="https://via.placeholder.com/150/7f8c8d/ffffff?text=P1" alt="Profile 1">
                <h2>Alex Johnson</h2>
                <p>Web Developer</p>
            </div>

            <div class="card card-2 sepia-filter">
                <img src="https://via.placeholder.com/150/95a5a6/ffffff?text=P2" alt="Profile 2">
                <h2>Sarah Lee</h2>
                <p>UX Designer</p>
            </div>
            
            <div class="card card-3 contrast-filter">
                <img src="https://via.placeholder.com/150/bdc3c7/ffffff?text=P3" alt="Profile 3">
                <h2>Mark Evans</h2>
                <p>Data Scientist</p>
            </div>
            
        </section>
    </main>
</body>
</html>
