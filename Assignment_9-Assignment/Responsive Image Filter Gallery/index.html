<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Responsive_Image_Filter_Gallery.css">
</head>
<body>
    <header>
        <h1>Responsive CSS Filter Gallery</h1>
        <p>Hover over images to remove the filter effect smoothly.</p>
    </header>
    
    <main class="container">
        <section class="image-grid">
            
            <figure class="gallery-item blur">
                <img src="https://via.placeholder.com/400x300/e74c3c/ffffff?text=Blur" alt="Blurred image">
                <figcaption>Filter: blur(5px)</figcaption>
            </figure>

            <figure class="gallery-item grayscale">
                <img src="https://via.placeholder.com/400x300/3498db/ffffff?text=Grayscale" alt="Grayscale image">
                <figcaption>Filter: grayscale(100%)</figcaption>
            </figure>
            
            <figure class="gallery-item sepia">
                <img src="https://via.placeholder.com/400x300/2ecc71/ffffff?text=Sepia" alt="Sepia image">
                <figcaption>Filter: sepia(100%)</figcaption>
            </figure>
            
            <figure class="gallery-item brightness">
                <img src="https://via.placeholder.com/400x300/9b59b6/ffffff?text=Brightness" alt="Brightness image">
                <figcaption>Filter: brightness(150%)</figcaption>
            </figure>
            
            <figure class="gallery-item contrast">
                <img src="https://via.placeholder.com/400x300/f1c40f/ffffff?text=Contrast" alt="Contrast image">
                <figcaption>Filter: contrast(200%)</figcaption>
            </figure>
            
            <figure class="gallery-item hue-rotate">
                <img src="https://via.placeholder.com/400x300/e67e22/ffffff?text=Hue-Rotate" alt="Hue-rotate image">
                <figcaption>Filter: hue-rotate(180deg)</figcaption>
            </figure>
            
        </section>
    </main>
    
    <footer>
        <p>Gallery demonstrating CSS filters and responsive grid layout.</p>
    </footer>
</body>
</html>
